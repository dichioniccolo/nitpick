# The identity CI deploys as, scoped to the `nitpick` namespace. The KUBECONFIG
# repository secret holds its token.
apiVersion: v1
kind: Namespace
metadata:
  name: nitpick
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: nitpick
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: nitpick
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: nitpick
rules:
  # Helm keeps release state in Secrets in the release namespace.
  - apiGroups: [""]
    resources: [secrets, configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Read-only: reading pod logs is what makes a failed migration hook debuggable from CI.
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  # The migration hook.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: nitpick
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: nitpick
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
