image:
  repository: ghcr.io/dichioniccolo/nitpick
  tag: ""
  pullPolicy: IfNotPresent

# The GHCR package is private. Copy the account's pull secret from `site`, as
# the lms chart does:
#
#   kubectl -n site get secret site-ghcr -o json |
#     jq '{apiVersion, kind, type, data, metadata: {name: "nitpick-ghcr", namespace: "nitpick"}}' |
#     kubectl apply -f -
imagePullSecrets:
  - name: nitpick-ghcr

# REQUIRED Secret, loaded whole into the pods:
#
#   DATABASE_URL            see deploy/README.md for the CloudNativePG form
#   AUTH_SECRET             better-auth signing key, `openssl rand -base64 32`
#   ANTHROPIC_API_KEY
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
secretName: nitpick-app

env:
  APP_URL: https://nitpick.niccolodichio.it
  GITHUB_APP_SLUG: nitpick-app
  ANTHROPIC_MODEL: claude-opus-5-5
  WORKER_CONCURRENCY: "2"
  # Effect exports only with both set. Spans in error are always kept; others sampled at 10%.
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318

web:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

worker:
  # One is enough: the queue is in Postgres, so more can be added without changes.
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    # A compressed tarball is held in memory, plus up to 256 MB of source per repository.
    limits: { memory: 1536Mi }

# kube-prometheus-stack picks these up from any namespace.
alerts:
  enabled: true

migrations:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

ingress:
  className: traefik
  host: nitpick.niccolodichio.it
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tlsSecretName: nitpick-tls

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
