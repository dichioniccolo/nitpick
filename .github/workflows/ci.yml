name: CI

# Every push to `main` runs the gates and publishes both images. The deploy job
# waits for the `DEPLOY_ENABLED` repository variable; see deploy/README.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nitpick

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Types, lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format
      - run: bun run sync
      - run: bun run check
      - run: bun run test
      # A new migration is an untracked file, which a plain `git diff` would not show.
      - name: Migrations match the tables
        run: |
          bunx drizzle-kit generate
          git add --intent-to-add migrations
          git diff --exit-code migrations

  instant-nav:
    name: Instant navigation guard
    runs-on: ubuntu-latest
    env:
      EXPOSE_TESTING_API: "1"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nitpick
      # https, as in production: better-auth then uses the `__Secure-` cookie the setup writes.
      APP_URL: https://nitpick.test
      AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      GITHUB_APP_SLUG: nitpick-test
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nitpick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nitpick"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:build
      - run: bun run e2e
      - run: bun run e2e:oauth

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/nitpick
      - run: helm template nitpick charts/nitpick --set image.tag=ci > /dev/null

  publish:
    name: Build and push images
    needs: [check, chart, instant-nav]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: [publish]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Never cancel a rollout midway: a cancelled `helm upgrade` stays pending-upgrade.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://nitpick.niccolodichio.it
    steps:
      - uses: actions/checkout@v7
      # The API server listens on a Tailscale address.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: azure/setup-helm@v5
      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"
      - name: helm upgrade
        run: |
          helm -n nitpick upgrade --install nitpick charts/nitpick \
            --set image.tag=sha-${{ github.sha }} \
            --wait --timeout 10m
