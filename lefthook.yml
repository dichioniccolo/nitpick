pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css,md,yml,yaml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks protect --staged --verbose
    typos:
      glob: "*.{ts,tsx,js,jsx,md,json}"
      run: typos {staged_files}
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
